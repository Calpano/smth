name: Build .mcpb bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (hash-pinned for security)

      - name: Build smth.mcpb bundle
        run: |
          rm -f smth.mcpb
          zip -r smth.mcpb \
            src/ \
            manifest.json \
            package.json \
            package-lock.json \
            LICENSE

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 (hash-pinned for security)
        with:
          name: smth-mcpb
          path: smth.mcpb

      # The generated notes only see pull requests, and most work lands straight on
      # main, so the section CHANGELOG.md carries for this tag goes above them.
      - name: Extract this tag's changelog section
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$version" '
              $0 ~ "^## " v " " || $0 == "## " v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi
          cat release-body.md

      - name: Create release and attach bundle
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2 (hash-pinned for security)
        with:
          files: smth.mcpb
          body_path: release-body.md
          generate_release_notes: true
          append_body: true
